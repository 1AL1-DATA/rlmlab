[project]
name = "rlmlab"
version = "0.1.0"
description = "Persistent IPython kernel harness (prime-agent style RLM + continual harness) exposed as a CLI for opencode/hermes adapters"
requires-python = ">=3.11"
dependencies = [
    "jupyter_client>=8.6",
    "ipykernel>=6.29",
    "pandas>=2.2",
    "numpy>=2.0",
    "dill>=0.4.1",
]

[project.scripts]
rlmlab = "rlmlab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rlmlab"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
