name: ci

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet ruff pytest
      - run: pip install --quiet -e .
      - name: ruff
        run: ruff check .
      - name: tests
        run: pytest -q